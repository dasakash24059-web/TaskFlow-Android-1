name: Build and Release TaskFlow APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types:
      - published
      - created
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release (ONLY after Firebase backend deployment & smoke tests pass)'
        required: false
        default: true
        type: boolean
      release_tag:
        description: 'Release tag to publish (leave empty to auto-detect from app/build.gradle.kts, e.g. v6.9)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore and Verify Signing Keystore from GitHub Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.TASKFLOW_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          EXPECTED_SHA1="a7aacdf1fa3e6bda90b72480c73200f8a6c2ea09"
          EXPECTED_SHA256="6a6158a49800ec46c4e4cb1b93253ff369686ab308cf72ad3472b022facd7b7f"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::GitHub Secret 'TASKFLOW_DEBUG_KEYSTORE_BASE64' সেট করা নেই (Missing or empty)! অনুগ্রহ করে GitHub Repository -> Settings -> Secrets and variables -> Actions-এ গিয়ে TASKFLOW_DEBUG_KEYSTORE_BASE64 যোগ করুন।"
            exit 1
          fi

          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]"' | base64 -d > debug.keystore 2>/dev/null; then
            echo "::error::'TASKFLOW_DEBUG_KEYSTORE_BASE64' Secret-এর মান সঠিক Base64 নয় (Invalid Base64 format)!"
            rm -f debug.keystore
            exit 1
          fi

          if [ ! -s debug.keystore ]; then
            echo "::error::Restored debug.keystore ফাইলটি খালি (0 bytes)! TASKFLOW_DEBUG_KEYSTORE_BASE64 Secret সঠিকভাবে পেস্ট করা হয়নি।"
            rm -f debug.keystore
            exit 1
          fi

          KEYSTORE_INFO=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android 2>&1 || true)
          KEYSTORE_SHA1=$(printf '%s\n' "$KEYSTORE_INFO" | grep -i "SHA1:" | head -n 1 | awk '{print tolower($NF)}' | tr -d ':')
          KEYSTORE_SHA256=$(printf '%s\n' "$KEYSTORE_INFO" | grep -i "SHA256:" | head -n 1 | awk '{print tolower($NF)}' | tr -d ':')

          if [ -z "$KEYSTORE_SHA1" ] || [ -z "$KEYSTORE_SHA256" ]; then
            echo "::error::Restored debug.keystore ফাইলটি একটি বৈধ TaskFlow Keystore নয় (alias: androiddebugkey, storepass: android পাওয়া যায়নি)।"
            rm -f debug.keystore
            exit 1
          fi

          echo "Restored Keystore SHA-1  : $KEYSTORE_SHA1"
          echo "Expected Firebase SHA-1  : $EXPECTED_SHA1"
          echo "Restored Keystore SHA-256: $KEYSTORE_SHA256"
          echo "Expected AppUpdate SHA256: $EXPECTED_SHA256"

          if [ "$KEYSTORE_SHA1" != "$EXPECTED_SHA1" ] || [ "$KEYSTORE_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Keystore fingerprint মিলছে না! পাওয়া গেছে SHA-1=$KEYSTORE_SHA1 / SHA-256=$KEYSTORE_SHA256, কিন্তু প্রতিষ্ঠিত TaskFlow signing identity হলো SHA-1=$EXPECTED_SHA1 / SHA-256=$EXPECTED_SHA256।"
            rm -f debug.keystore
            exit 1
          fi

          # Prepare my-upload-key.jks with alias 'upload' from the verified TaskFlow certificate
          # so signingConfigs.getByName("release") in app/build.gradle.kts produces a genuine
          # Release APK (BuildConfig.DEBUG == false, Play Integrity, R8, production Unity Ads)
          # signed with the exact established TaskFlow SHA-1 and SHA-256 identity.
          cp debug.keystore my-upload-key.jks
          keytool -changealias -keystore my-upload-key.jks -storepass android -keypass android -alias androiddebugkey -destalias upload

          UPLOAD_INFO=$(keytool -list -v -keystore my-upload-key.jks -alias upload -storepass android -keypass android 2>&1 || true)
          UPLOAD_SHA1=$(printf '%s\n' "$UPLOAD_INFO" | grep -i "SHA1:" | head -n 1 | awk '{print tolower($NF)}' | tr -d ':')
          UPLOAD_SHA256=$(printf '%s\n' "$UPLOAD_INFO" | grep -i "SHA256:" | head -n 1 | awk '{print tolower($NF)}' | tr -d ':')

          if [ "$UPLOAD_SHA1" != "$EXPECTED_SHA1" ] || [ "$UPLOAD_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Release signing keystore (my-upload-key.jks) fingerprint mismatch after alias mapping!"
            rm -f debug.keystore my-upload-key.jks
            exit 1
          fi

          if [ -f google-services.json ] && [ ! -f app/google-services.json ]; then
            cp google-services.json app/google-services.json
          fi

      - name: Set up Node.js for Firebase Emulator & Cloud Functions Tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Firebase Emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-v2

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run All 15 Cloud Functions Backend Test Suites (9 node:test + 6 Custom Assertion Suites)
        run: |
          set -euo pipefail
          cd functions
          npm install
          node --test \
            test_audit_remediation.js \
            test_campaign_admin.js \
            test_campaign_click_issuance.js \
            test_campaign_conversions.js \
            test_campaign_tracking_foundation.js \
            test_p0_remediation.js \
            test_phase3d_remediation.js \
            test_proof_upload_phase_f3.js \
            test_step9a_backend.js
          node test_phase3e_e2e.js
          node test_promo_backend.js
          node test_rewards_step5.js
          node test_scratch_backend.js
          node test_security.js
          node test_signature.js

      - name: Run All Unit, Storage Rules & Firestore Emulator Rule Tests
        run: |
          set -euo pipefail
          npm install --no-save @firebase/rules-unit-testing@^5.0.0 firebase@^12.0.0
          npx --yes firebase-tools emulators:exec --config firebase.emulator.json --project demo-no-project --only auth,firestore,storage "node --test --test-concurrency=1 storage.test.js firestore.test.js firestore.promo.test.js firestore.withdrawal.test.js firestore.campaign_tracking.test.js && gradle testDebugUnitTest"

      - name: Build Production Release APK (BuildConfig.DEBUG == false, Play Integrity, R8)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          set -euo pipefail
          gradle :app:assembleRelease

      - name: Select Release APK & Enforce Fail-Closed Signing Identity (SHA-1 & SHA-256)
        id: select_and_verify_apk
        run: |
          set -euo pipefail
          EXPECTED_SHA1="a7aacdf1fa3e6bda90b72480c73200f8a6c2ea09"
          EXPECTED_SHA256="6a6158a49800ec46c4e4cb1b93253ff369686ab308cf72ad3472b022facd7b7f"

          SELECTED_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SELECTED_APK" ]; then
            echo "::error::Built Release APK পাওয়া যায়নি: $SELECTED_APK"
            exit 1
          fi

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=""
          if [ -n "$SDK_DIR" ] && [ -d "$SDK_DIR/build-tools" ]; then
            APKSIGNER=$(find "$SDK_DIR/build-tools" -maxdepth 2 \( -type f -o -type l \) -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          fi

          ACTUAL_SHA1=""
          ACTUAL_SHA256=""
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$SELECTED_APK" 2>&1 || true)
            echo "$CERT_OUTPUT"
            ACTUAL_SHA1=$(printf '%s\n' "$CERT_OUTPUT" | grep -i "certificate SHA-1 digest:" | head -n 1 | awk '{print tolower($NF)}' | tr -d ':')
            ACTUAL_SHA256=$(printf '%s\n' "$CERT_OUTPUT" | grep -i "certificate SHA-256 digest:" | head -n 1 | awk '{print tolower($NF)}' | tr -d ':')
          fi

          if [ -z "$ACTUAL_SHA1" ] || [ -z "$ACTUAL_SHA256" ]; then
            CERT_OUTPUT=$(keytool -printcert -jarfile "$SELECTED_APK" 2>&1 || true)
            echo "$CERT_OUTPUT"
            ACTUAL_SHA1=$(printf '%s\n' "$CERT_OUTPUT" | grep -i "SHA1:" | head -n 1 | awk '{print tolower($NF)}' | tr -d ':')
            ACTUAL_SHA256=$(printf '%s\n' "$CERT_OUTPUT" | grep -i "SHA256:" | head -n 1 | awk '{print tolower($NF)}' | tr -d ':')
          fi

          if [ -z "$ACTUAL_SHA1" ] || [ -z "$ACTUAL_SHA256" ]; then
            echo "::error::Release APK থেকে Signing Certificate SHA-1 / SHA-256 পড়া সম্ভব হয়নি!"
            exit 1
          fi

          echo "Selected Release APK Path : $SELECTED_APK"
          echo "Verified Release SHA-1    : $ACTUAL_SHA1"
          echo "Expected SHA-1            : $EXPECTED_SHA1"
          echo "Verified Release SHA-256  : $ACTUAL_SHA256"
          echo "Expected SHA-256          : $EXPECTED_SHA256"

          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Release APK Signing Certificate SHA-1 ($ACTUAL_SHA1) এবং Firebase Registered SHA-1 ($EXPECTED_SHA1) মিলছে না!"
            exit 1
          fi

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Release APK Signing Certificate SHA-256 ($ACTUAL_SHA256) এবং Installed AppUpdateManager SHA-256 ($EXPECTED_SHA256) মিলছে না!"
            exit 1
          fi

          # Verify Universal APK completeness: size >= 18 MB, all 4 ABIs present, package ID and launchable activity intact
          APK_BYTES=$(wc -c < "$SELECTED_APK" | tr -d ' ')
          echo "Verified Universal APK Size (bytes): $APK_BYTES"
          if [ "$APK_BYTES" -lt 18000000 ]; then
            echo "::error::APK size ($APK_BYTES bytes) is unexpectedly small (< 18 MB)! R8 shrinking or incomplete packaging detected."
            exit 1
          fi

          for ABI in "arm64-v8a" "armeabi-v7a" "x86" "x86_64"; do
            if ! unzip -l "$SELECTED_APK" | grep -q "lib/$ABI/"; then
              echo "::error::Universal APK is missing native library directory for ABI: $ABI"
              exit 1
            fi
          done

          AAPT2=""
          if [ -n "$SDK_DIR" ] && [ -d "$SDK_DIR/build-tools" ]; then
            AAPT2=$(find "$SDK_DIR/build-tools" -maxdepth 2 \( -type f -o -type l \) -name aapt2 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -n "$AAPT2" ] && [ -x "$AAPT2" ]; then
            BADGING=$("$AAPT2" dump badging "$SELECTED_APK")
            echo "$BADGING" | grep -E "package:|launchable-activity:|native-code:"
            if ! printf '%s\n' "$BADGING" | grep -q "name='com.aistudio.taskflow.kxmpzq'"; then
              echo "::error::APK package ID mismatch in badging!"
              exit 1
            fi
            if ! printf '%s\n' "$BADGING" | grep -q "launchable-activity: name='com.example.MainActivity'"; then
              echo "::error::APK launchable-activity com.example.MainActivity missing!"
              exit 1
            fi
          fi

          echo "selected_apk=$SELECTED_APK" >> $GITHUB_OUTPUT
          echo "SUCCESS: Universal Release APK ($SELECTED_APK) matches established TaskFlow SHA-1, SHA-256, package ID, and multi-ABI native libraries!"

      - name: Prepare Single Full Release APK & version.json
        id: prepare_apk
        run: |
          set -euo pipefail
          VC=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -n 1 | tr -d ' ' | cut -d '=' -f 2)
          VN=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | tr -d ' "' | cut -d '=' -f 2)

          if [ "${GITHUB_EVENT_NAME:-}" = "release" ] && [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          else
            TAG_NAME="v${VN:-7.2}"
          fi
          VERSION="$TAG_NAME"

          SOURCE_APK="${{ steps.select_and_verify_apk.outputs.selected_apk }}"
          if [ -z "$SOURCE_APK" ] || [ ! -f "$SOURCE_APK" ]; then
            echo "::error::Verified release APK source file missing: $SOURCE_APK"
            exit 1
          fi

          SINGLE_APK="app/build/outputs/apk/release/TaskFlow.apk"
          cp "$SOURCE_APK" "$SINGLE_APK"

          APK_SIZE=$(ls -lh "$SINGLE_APK" | awk '{print $5}')
          echo "Single Full APK Size: $APK_SIZE ($SINGLE_APK)"

          cat <<EOF > version.json
          {
            "latest_version_code": ${VC:-52},
            "latest_version_name": "${VN:-7.2}",
            "download_url": "https://github.com/${{ github.repository }}/releases/latest/download/TaskFlow.apk",
            "release_notes": "TaskFlow v${VN:-7.2}: Complete Universal APK restoration with full multi-ABI native libraries, Phase F.3 server-ticketed proof upload pipeline, App Check Play Integrity, and APK signature verification.",
            "force_update": false
          }
          EOF
          echo "single_apk=$SINGLE_APK" >> $GITHUB_OUTPUT
          echo "version_json=version.json" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Prepared single full APK: $SINGLE_APK ($APK_SIZE) and version.json"

      - name: Clean up restored keystores
        if: always()
        run: rm -f debug.keystore my-upload-key.jks

      - name: Upload Single Full APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-APK
          path: |
            ${{ steps.prepare_apk.outputs.single_apk }}
            version.json
          if-no-files-found: error

      - name: Create or Update GitHub Release Automatically (Single TaskFlow.apk & version.json)
        id: create_release
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          name: "TaskFlow Release ${{ steps.prepare_apk.outputs.version }}"
          tag_name: ${{ steps.prepare_apk.outputs.tag_name }}
          files: |
            ${{ steps.prepare_apk.outputs.single_apk }}
            ${{ steps.prepare_apk.outputs.version_json }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload & Verify Single TaskFlow.apk and version.json on GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.prepare_apk.outputs.tag_name }}"
          echo "Uploading and verifying single full TaskFlow.apk and version.json on GitHub Release '$TAG'..."
          gh release upload "$TAG" \
            "${{ steps.prepare_apk.outputs.single_apk }}" \
            "${{ steps.prepare_apk.outputs.version_json }}" \
            --clobber --repo "${{ github.repository }}"

          # Remove any duplicate legacy APK asset names if they exist on this tag
          EXISTING_ASSETS=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' || true)
          for ASSET_NAME in $EXISTING_ASSETS; do
            if [ "$ASSET_NAME" != "TaskFlow.apk" ] && [ "$ASSET_NAME" != "version.json" ]; then
              echo "Removing duplicate extra asset '$ASSET_NAME' from release '$TAG' so only TaskFlow.apk and version.json remain..."
              gh release delete-asset "$TAG" "$ASSET_NAME" --yes --repo "${{ github.repository }}" || true
            fi
          done

          ASSETS_JSON=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[] | "\(.name) (\(.size) bytes)"')
          echo "Final Attached Release Assets on '$TAG':"
          echo "$ASSETS_JSON"

          if ! gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -Fxq "TaskFlow.apk"; then
            echo "::error::TaskFlow.apk ফাইলটি GitHub Release '$TAG'-এ যুক্ত হয়নি!"
            exit 1
          fi
          echo "SUCCESS: Single full TaskFlow.apk and version.json are published to GitHub Releases under '$TAG'!"



