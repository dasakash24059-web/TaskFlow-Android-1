name: Build and Release TaskFlow APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore and Verify debug.keystore from GitHub Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.TASKFLOW_DEBUG_KEYSTORE_BASE64 }}
        run: |
          EXPECTED_SHA1="a7aacdf1fa3e6bda90b72480c73200f8a6c2ea09"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::GitHub Secret 'TASKFLOW_DEBUG_KEYSTORE_BASE64' সেট করা নেই (Missing or empty)! অনুগ্রহ করে GitHub Repository -> Settings -> Secrets and variables -> Actions-এ গিয়ে TASKFLOW_DEBUG_KEYSTORE_BASE64 যোগ করুন।"
            exit 1
          fi

          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]"' | base64 -d > debug.keystore 2>/dev/null; then
            echo "::error::'TASKFLOW_DEBUG_KEYSTORE_BASE64' Secret-এর মান সঠিক Base64 নয় (Invalid Base64 format)!"
            rm -f debug.keystore
            exit 1
          fi

          if [ ! -s debug.keystore ]; then
            echo "::error::Restored debug.keystore ফাইলটি খালি (0 bytes)! TASKFLOW_DEBUG_KEYSTORE_BASE64 Secret সঠিকভাবে পেস্ট করা হয়নি।"
            rm -f debug.keystore
            exit 1
          fi

          KEYSTORE_INFO=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android 2>&1 || true)
          KEYSTORE_SHA1=$(printf '%s\n' "$KEYSTORE_INFO" | grep -i "SHA1:" | head -n 1 | awk '{print tolower($NF)}' | tr -d ':')

          if [ -z "$KEYSTORE_SHA1" ]; then
            echo "::error::Restored debug.keystore ফাইলটি একটি বৈধ Android Debug Keystore নয় (alias: androiddebugkey, storepass: android পাওয়া যায়নি)।"
            rm -f debug.keystore
            exit 1
          fi

          echo "Restored Keystore SHA-1: $KEYSTORE_SHA1"
          echo "Expected Firebase SHA-1: $EXPECTED_SHA1"

          if [ "$KEYSTORE_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Keystore SHA-1 মিলছে না! পাওয়া গেছে: $KEYSTORE_SHA1, কিন্তু Firebase-এ রেজিস্টার করা আছে: $EXPECTED_SHA1। নতুন তৈরি করা Keystore ব্যবহার না করে AI Studio-এর আসল debug.keystore.base64 ব্যবহার করুন।"
            rm -f debug.keystore
            exit 1
          fi

          if [ -f google-services.json ] && [ ! -f app/google-services.json ]; then
            cp google-services.json app/google-services.json
          fi

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --continue || true

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Verify APK Signing Certificate
        run: |
          EXPECTED_SHA1="a7aacdf1fa3e6bda90b72480c73200f8a6c2ea09"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Built APK পাওয়া যায়নি: $APK_PATH"
            exit 1
          fi

          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=""
          if [ -n "$SDK_DIR" ] && [ -d "$SDK_DIR/build-tools" ]; then
            APKSIGNER=$(find "$SDK_DIR/build-tools" -maxdepth 2 \( -type f -o -type l \) -name apksigner 2>/dev/null | sort -V | tail -n 1)
          fi

          ACTUAL_SHA1=""
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1 || true)
            echo "$CERT_OUTPUT"
            ACTUAL_SHA1=$(printf '%s\n' "$CERT_OUTPUT" | grep -i "certificate SHA-1 digest:" | head -n 1 | awk '{print tolower($NF)}' | tr -d ':')
          fi

          if [ -z "$ACTUAL_SHA1" ]; then
            CERT_OUTPUT=$(keytool -printcert -jarfile "$APK_PATH" 2>&1 || true)
            echo "$CERT_OUTPUT"
            ACTUAL_SHA1=$(printf '%s\n' "$CERT_OUTPUT" | grep -i "SHA1:" | head -n 1 | awk '{print tolower($NF)}' | tr -d ':')
          fi

          if [ -z "$ACTUAL_SHA1" ]; then
            echo "::error::APK থেকে Signing Certificate SHA-1 পড়া সম্ভব হয়নি!"
            exit 1
          fi

          echo "Verified APK SHA-1 : $ACTUAL_SHA1"
          echo "Expected SHA-1     : $EXPECTED_SHA1"

          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::APK Signing Certificate SHA-1 ($ACTUAL_SHA1) এবং Firebase Registered SHA-1 ($EXPECTED_SHA1) মিলছে না!"
            exit 1
          fi

          echo "SUCCESS: APK Signing Certificate SHA-1 matches Firebase configuration!"

      - name: Prepare Versioned Release APK
        id: prepare_apk
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="v1.0.0-$(date +'%Y%m%d%H%M')"
          fi
          RELEASE_APK="app/build/outputs/apk/debug/TaskFlow-${VERSION}.apk"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_APK"
          echo "apk_path=$RELEASE_APK" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Prepared APK: $RELEASE_APK"

      - name: Clean up restored keystore
        if: always()
        run: rm -f debug.keystore

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-APK
          path: app/build/outputs/apk/debug/TaskFlow-*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "TaskFlow Release ${{ steps.prepare_apk.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
